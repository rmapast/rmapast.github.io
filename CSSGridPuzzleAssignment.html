		<title>CSS Grid Puzzle Assignment</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="author" content="Roman Pastukhov">

		<style>
			.PuzzleContainer {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				width:600px;
				height: 440px;
				border:10px solid #000000 0px 10px solid #000000 0px;
				
			}
			.GridLayout {
				display: grid;
				grid-template-rows: 10% 75% 15%;
				border: 0px;
				margin:20px;
				height: 700px;
				text-align: center;
			}
			.PuzzleSenterPart {
				display: flex;
    			justify-content: center;
			}
			.img1 {order: 1;}
			.img2 {order: 2;}
			.img3 {order: 3;}
			.img4 {order: 4;}
			.img5 {order: 5;}
			.img6 {order: 6;}
			.img7 {order: 7;}
			.img8 {order: 8;}
			.img9 {order: 9;}
			.img10 {order: 10;}
			.img11 {order: 11;}
			.img12 {order: 12;}
			.img13 {order: 13;}
			.img14 {order: 14;}
			.img15 {order: 15;}
			.img16 {order: 16;}
			.img17 {order: 17; display:none;}

		</style>
	</head>
<body>
<section class="GridLayout">
